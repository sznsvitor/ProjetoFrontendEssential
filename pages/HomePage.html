<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clima Tempo</title>
<link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#0a1f44,#0d6efd);
        color:white;
        text-align:center;
    }

.home-box{
    animation: fade 1s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>
    <body>

        <div class="home-box">
            <h1 class="display-3">Clima Tempo</h1>
                <p class="lead">Consulte a previsão do tempo em segundos</p>
                    <button class="btn btn-light btn-lg mt-3"
                        onclick="entrarSite()">
                        Ver previsão do tempo
                    </button>
        </div>

        <script> function entrarSite(){ window.location.href = "../index.html";} </script>
        
    </body>
</html>
