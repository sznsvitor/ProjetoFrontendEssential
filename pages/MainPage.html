<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatherly</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
  </head>
  <body>
    <header class="text-white p-5 header-gradient">
      <div class="container d-flex align-items-center gap-3 position-relative">

        <div class="position-relative">
          <img
            id="menu-icon"
            class="img-fluid menu-icon-hover"
            src="../svg/menu.svg"
            alt="menu"
            style="width: 2.5rem; cursor: pointer"
          />
          <nav id="menu-option" class="collapse shadow-lg rounded mt-2 menu-box position-absolute ">
            <div class="d-flex flex-column">
              <a href="HomePage.html" class="nav-link p-3 border-bottom">Home</a>
              <a href="about.html" class="nav-link p-3 border-bottom">About</a>
              <a href="FaleConosco.html" class="nav-link p-3">Contact</a>
            </div>
          </nav>
        </div>
        <h1 class="display-3 fw-bold mb-0 flex-grow-1 text-center">Weatherly</h1>
      </div>
    </header>

    <main
      class="d-flex justify-content-center align-items-center"
      style="height: 70vh"
    >
      <div class="card p-4 shadow-lg text-center search-box">
        <h2 class="mb-3">Busque o clima da sua cidade</h2>
        <form id="form" class="input-group mb-3" style="max-width: 400px">
          <input
            type="text"
            id="cidade"
            class="form-control"
            placeholder="Digite o nome da cidade"
          />
          <button type="submit" class="btn btn-primary">
            Buscar
          </button>
        </form>
        <div id="resultado" class="mt-4"></div>
      </div>
    </main>
    <footer class="bg-dark text-white text-center p-3">
      <p> © 2026 - Weatherly</p>
      <div>
        <a href="https://github.com/sznsvitor/ProjetoFrontendEssential" target="_blank" class="text-white me-3 nav-link p-3">GitHub</a>
      </div>
    </footer>
    <script src="../js/mudarFundo.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/pesquisaClima.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/vlibras.js"></script>
  </body>
</html>
