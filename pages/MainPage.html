<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatherly</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
  </head>
  <body>
    <header
      class="text-white text-center p-5 position-relative header-gradient"
    >
      <div class="container">
        <h1 class="display-3 fw-bold">Weatherly</h1>
        <p class="lead">Busque o clima da sua cidade</p>
        <img
          id="menu-icon"
          class="img-fluid"
          src="../img/ClimaTempo.png"
          alt="menu"
          style="width: 90px; cursor: pointer"
        />
        <nav id="menu-option" class="collapse shadow-lg rounded mt-2 menu-box">
          <div class="d-flex flex-column">
            <a href="HomePage.html" class="nav-link p-3 border-bottom">Home</a>
            <a href="about.html" class="nav-link p-3 border-bottom">About</a>
            <a href="FaleConosco.html" class="nav-link p-3">Contact</a>
          </div>
        </nav>
      </div>
    </header>
    <main
      class="d-flex justify-content-center align-items-center"
      style="height: 70vh"
    >
      <div class="card p-4 shadow-lg text-center search-box">
        <h2 class="mb-3">Buscar</h2>
        <div class="input-group mb-3">
          <input
            type="text"
            id="cidade"
            class="form-control"
            placeholder="Digite o nome da cidade"
          />
          <button class="btn btn-primary" onclick="buscarClima()">
            Buscar
          </button>
        </div>
        <div id="resultado" class="mt-4"></div>
      </div>
    </main>
    <footer class="bg-dark text-white text-center p-3">
      <p>© 2026 - Weatherly</p>
      <div>
        <a href="#" class="text-white me-3">GitHub</a>
        <a href="#" class="text-white">LinkedIn</a>
      </div>
    </footer>
    <script src="../js/script.js"></script>
    <script src="../js/funcionalidade.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
